user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # gzip settings (opcional, descomenta si es necesario)
    # gzip on;
    # gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Deshabilitar GeoIP para local (opcional)
    # geoip_country /var/lib/nginx/maxmind-country.dat;
    # geoip_city /var/lib/nginx/maxmind-city.dat;
    # geoip_proxy_recursive on;
    # geoip_proxy 172.16.0.0/14;

    # Mapas de idiomas (funcionan aunque GeoIP esté deshabilitado)

    # Configuración del servidor local
    server {
        listen 80;
        server_name localhost;

        root /var/www/public;
        index index.php index.html;

        # Configuración para Laravel o PHP
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Procesar archivos PHP
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass app:9000; # Asegúrate de que apunte al contenedor PHP
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        # Logs de error y acceso
        error_log /var/log/nginx/error.log;
        access_log /var/log/nginx/access.log main;
    }

    # Incluir configuraciones adicionales para más hosts o ajustes
    include /etc/nginx/conf.d/*.conf;
}

